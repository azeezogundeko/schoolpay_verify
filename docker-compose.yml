services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: schoolpay-backend
    restart: always
    expose:
      - 3001
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DOCKER_CONTAINER=1
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - traefik.enable=true
      - traefik.http.routers.schoolpay-backend.rule=Host(`api.schoolpay.yourdomain.com`)
      - traefik.http.routers.schoolpay-backend.entrypoints=websecure
      - traefik.http.routers.schoolpay-backend.tls=true
      - traefik.http.routers.schoolpay-backend.tls.certresolver=letsencrypt
      - traefik.http.services.schoolpay-backend.loadbalancer.server.port=3001

  # Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: schoolpay-frontend
    restart: always
    expose:
      - 80
    env_file:
      - .env
    environment:
      - VITE_API_URL=https://api.schoolpay.yourdomain.com/api
    depends_on:
      - backend
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.schoolpay-frontend.rule=Host(`schoolpay.yourdomain.com`)
      - traefik.http.routers.schoolpay-frontend.entrypoints=websecure
      - traefik.http.routers.schoolpay-frontend.tls=true
      - traefik.http.routers.schoolpay-frontend.tls.certresolver=letsencrypt
      - traefik.http.services.schoolpay-frontend.loadbalancer.server.port=80

volumes:
  backend-uploads:
    driver: local

networks:
  dokploy-network:
    external: true
